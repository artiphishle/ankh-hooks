name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-store-hooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run store hook tests
        run: bun run test:store

      - name: Run build
        run: bun run build

      - name: Verify browser-safe store subpath
        run: |
          node -e "import('ankh-hooks/store').then(module => { if (typeof module.useLocalStorage !== 'function') process.exit(1) })"
          if grep -E 'require\(["'\'' ]fs|from ["'\'']fs|node:fs' dist/store.js dist/store.mjs; then
            echo "Store bundle unexpectedly contains Node fs imports."
            exit 1
          fi
